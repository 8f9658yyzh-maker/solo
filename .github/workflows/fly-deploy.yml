# SOLO を Fly.io に置く(GitHub の機械で動く)。
# 動くとき: このブランチにプログラムの変更が届いたとき / GitHub の画面の「Run workflow」を押したとき
# 必要な金庫の値(GitHub → Settings → Secrets and variables → Actions):
#   FLY_API_TOKEN    Fly.io の合鍵
#   SOLO_SETUP_CODE  最初の設定(作成者を作る)の合言葉。8文字以上。作成者を作った後は使われない
#   緊急の知らせ(スマホを鳴らす。どちらか、または両方):
#     NTFY_TOPIC / NTFY_TOKEN(ntfy。TOKEN はあれば)   PUSHOVER_TOKEN / PUSHOVER_USER(Pushover)
# 名前を変えたいとき: Variables に FLY_APP(例 solo-club-ishigaki)。なければ solo-club
name: Fly.io に置く
on:
  workflow_dispatch:
    inputs:
      force:
        description: '遊んでいる卓があっても置く(卓は今のゲームの後に閉じ、チップはポケットへ戻る)'
        type: boolean
        default: false
  push:
    branches: [claude/vigilant-johnson-desok1]
    paths: ['server/**', 'web/**', 'engine.js', 'Dockerfile', 'fly.toml', 'package.json', '.github/workflows/fly-deploy.yml']
concurrency:
  group: fly-deploy
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      SETUP_CODE: ${{ secrets.SOLO_SETUP_CODE }}
      APP: ${{ vars.FLY_APP || 'solo-club' }}
    steps:
      - uses: actions/checkout@v4
      - name: 合鍵があるか確かめる
        id: key
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::warning::GitHub の金庫に FLY_API_TOKEN がまだないので、置かずに終わります"
            echo "ok=0" >> "$GITHUB_OUTPUT"
          else
            echo "ok=1" >> "$GITHUB_OUTPUT"
          fi
      - name: 遊んでいる卓がないか確かめる(あれば止めて、かいとさんに知らせる)
        if: steps.key.outputs.ok == '1'
        env:
          FORCE: ${{ inputs.force }}
        run: |
          H=$(curl -fsS "https://$APP.fly.dev/api/health" || echo '{}')
          echo "$H"
          ACT=$(echo "$H" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{let j={};try{j=JSON.parse(s)}catch(e){}console.log((j.activeTables||0)+" "+(j.seated||0)+" "+(j.maintenance?1:0))})')
          set -- $ACT
          if [ "$1" -gt 0 ] && [ "$3" != "1" ] && [ "$FORCE" != "true" ]; then
            echo "::error::いま $1 卓が動いていて、$2 人が座っています。置くと、その卓は今のゲームの後に閉じます。管理画面で「予告を出す」→ システム更新中になってから、Actions の「Run workflow」で置いてください(急ぐときは force に印をつける)"
            exit 1
          fi
          echo "止めてよい状態です(動いている卓 $1 / システム更新中 $3)"
      - uses: actions/setup-node@v4
        if: steps.key.outputs.ok == '1'
        with:
          node-version: 22
      - name: 試験(合格したときだけ置く)
        if: steps.key.outputs.ok == '1'
        # 手数料の試験は、元のコードから時々落ちる既知の問題があるため、落ちたときだけもう1回流す
        run: npm test || { echo "::warning::落ちた試験があったので、もう1回だけ流します"; npm test; }
      - uses: superfly/flyctl-actions/setup-flyctl@master
        if: steps.key.outputs.ok == '1'
      - name: アプリと保存領域を用意する(初回だけ)
        if: steps.key.outputs.ok == '1'
        run: |
          set -e
          if ! flyctl status -a "$APP" > /dev/null 2>&1; then
            ORG=$(flyctl orgs list --json | node -e 'const o=JSON.parse(require("fs").readFileSync(0,"utf8"));const a=Array.isArray(o)?o.map(x=>x.slug||x.Slug):Object.keys(o);console.log(a.includes("personal")?"personal":a[0])')
            echo "アプリ $APP を $ORG に作ります"
            flyctl apps create "$APP" --org "$ORG"
          fi
          if ! flyctl volumes list -a "$APP" --json | grep -q '"solo_data"'; then
            flyctl volumes create solo_data -a "$APP" --region nrt --size 3 --yes
          fi
      - name: 緊急の知らせの送り先を本番に入れる(金庫にあるものだけ)
        if: steps.key.outputs.ok == '1'
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
        run: |
          ARGS=""
          for k in NTFY_TOPIC NTFY_TOKEN PUSHOVER_TOKEN PUSHOVER_USER; do v="${!k}"; [ -n "$v" ] && ARGS="$ARGS $k=$v"; done
          if [ -n "$ARGS" ]; then flyctl secrets set $ARGS -a "$APP" --stage > /dev/null && echo "送り先を入れました"; else echo "::warning::緊急の知らせの送り先が金庫にありません(NTFY_TOPIC か PUSHOVER_TOKEN/PUSHOVER_USER)"; fi
      - name: 最初の設定の合言葉を入れる
        if: steps.key.outputs.ok == '1' && env.SETUP_CODE != ''
        run: flyctl secrets set "SETUP_CODE=$SETUP_CODE" -a "$APP" --stage
      - name: 置く(機械は1台だけ)
        if: steps.key.outputs.ok == '1'
        run: flyctl deploy -a "$APP" --remote-only --ha=false -e "PUBLIC_URL=https://$APP.fly.dev"
      - name: 動いているか確かめる
        if: steps.key.outputs.ok == '1'
        run: |
          for i in $(seq 1 12); do
            if curl -fsS "https://$APP.fly.dev/api/health"; then echo; echo "動いています: https://$APP.fly.dev"; exit 0; fi
            sleep 10
          done
          echo "::error::置いたあと2分たっても健康診断が答えません"; exit 1
      - name: 失敗・止めたときはスマホを鳴らす(送り先が金庫にあるとき)
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          T="【緊急】SOLO: 本番へ置けませんでした"; M="遊んでいる卓があった・試験の失敗など。理由はここ: $RUN"
          if [ -n "$NTFY_TOPIC" ]; then
            H=(); [ -n "$NTFY_TOKEN" ] && H=(-H "Authorization: Bearer $NTFY_TOKEN")
            curl -s "${H[@]}" -H 'Content-Type: application/json' -X POST https://ntfy.sh/ -d "$(node -e 'console.log(JSON.stringify({topic:process.argv[1],title:process.argv[2],message:process.argv[3],priority:5,tags:["rotating_light"]}))' "$NTFY_TOPIC" "$T" "$M")" > /dev/null && echo "ntfy へ送りました"
          fi
          if [ -n "$PUSHOVER_TOKEN" ] && [ -n "$PUSHOVER_USER" ]; then
            curl -s https://api.pushover.net/1/messages.json --form-string "token=$PUSHOVER_TOKEN" --form-string "user=$PUSHOVER_USER" --form-string "title=$T" --form-string "message=$M" --form-string "priority=2" --form-string "retry=30" --form-string "expire=1800" --form-string "sound=siren" > /dev/null && echo "Pushover へ送りました"
          fi
          [ -n "$NTFY_TOPIC$PUSHOVER_TOKEN" ] || echo "送り先がないので、GitHub からのメールだけです"
